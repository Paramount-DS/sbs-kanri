<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URLデータ検出ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --blue: #1a5cb8;
    --blue-dark: #0f3d82;
    --ink: #1e2330;
    --sub: #5a6475;
    --line: #e2e6ed;
    --bg: #f4f6fa;
    --danger: #c0392b;
    --danger-bg: #fff0ee;
    --ok: #1b8a5a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", -apple-system, "Yu Gothic UI", Meiryo, sans-serif; font-size: 14px; line-height: 1.6; }

  .bar { background: #fff; border-bottom: 1px solid var(--line); padding: 0 20px; height: 56px; display: flex; align-items: center; gap: 16px; }
  .bar h1 { font-size: 16px; margin: 0; font-weight: 700; }
  .back { color: var(--blue); text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .back:hover { text-decoration: underline; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 80px; }

  .intro { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  .intro p { margin: 0 0 8px; color: var(--sub); }
  .intro p:last-of-type { margin-bottom: 14px; }

  .btn { font-family: inherit; font-size: 13px; font-weight: 600; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .btn:hover:not(:disabled) { background: #f0f2f5; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--blue-dark); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.danger:hover:not(:disabled) { background: #a5301f; }
  .btn:focus-visible { outline: 3px solid rgba(26,92,184,.35); outline-offset: 2px; }

  .status { margin-top: 14px; min-height: 22px; font-size: 13px; color: var(--sub); }
  .status.ok { color: var(--ok); font-weight: 600; }
  .status.err { color: var(--danger); font-weight: 600; }

  h2 { font-size: 14px; margin: 24px 0 8px; }
  table.summary { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; }
  table.summary th, table.summary td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; }
  table.summary th { background: #f8f9fb; color: var(--sub); font-weight: 600; }
  table.summary td.num, table.summary th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.summary tr:last-child td { border-bottom: none; }
  table.summary .hit { color: var(--danger); font-weight: 700; }
  table.summary .error { color: var(--danger); }

  .toolbar { position: sticky; top: 0; z-index: 5; margin-top: 18px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .toolbar .count { margin-left: auto; color: var(--sub); font-size: 13px; }

  .group { margin-top: 18px; }
  .group-head { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 6px; }
  .group-head h3 { margin: 0; font-size: 15px; }
  .group-head span { color: var(--sub); font-size: 12px; }

  .doc { background: #fff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .doc-head { padding: 9px 14px; background: #f8f9fb; border-bottom: 1px solid var(--line); font-weight: 600; }
  .doc-head small { color: var(--sub); font-weight: 400; margin-left: 8px; }

  .row { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row input[type=checkbox] { width: 17px; height: 17px; margin-top: 3px; accent-color: var(--blue); }
  .field { font-size: 12px; font-weight: 700; color: var(--blue-dark); margin-bottom: 6px; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.6; }
  .box .tag { display: block; font-size: 11px; font-weight: 700; color: var(--sub); margin-bottom: 3px; }
  .box.before { background: var(--danger-bg); border-color: #f5c6c6; }
  .box.after { background: #f4faf7; border-color: #cfe9dc; }
  .box.after.empty { color: var(--sub); font-style: italic; }
  mark { background: #ffc9c2; color: #7a1608; border-radius: 3px; padding: 0 2px; font-weight: 700; }

  .none { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--ok); font-weight: 700; margin-top: 18px; }

  @media (max-width: 700px) {
    .bar { padding: 0 12px; gap: 10px; }
    .cmp { grid-template-columns: 1fr; }
    .toolbar .count { margin-left: 0; width: 100%; }
    .btn { padding: 9px 12px; }
  }
</style>
</head>
<body>

<header class="bar">
  <a class="back" href="index.html">← 案件管理に戻る</a>
  <h1>URLデータ検出ツール</h1>
</header>

<main class="wrap">
  <section class="intro">
    <p>全支店の案件データと導入支援（CS）のデータを読み込み、URL（Slack・社内リンクなど）が入っている項目を一覧にします。</p>
    <p>スキャンだけでは、データは何も変更されません。削除は、項目を選んで削除ボタンを押したときだけ実行されます。</p>
    <button id="scanBtn" class="btn primary" type="button">スキャンを開始</button>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section id="summarySection" hidden>
    <h2>スキャン結果の内訳</h2>
    <table class="summary">
      <thead>
        <tr><th>対象</th><th class="num">データ件数</th><th class="num">URLを含む件数</th><th class="num">検出した項目</th></tr>
      </thead>
      <tbody id="summaryBody"></tbody>
    </table>
  </section>

  <section id="toolbar" class="toolbar" hidden>
    <button id="selectAllBtn" class="btn" type="button">すべて選択</button>
    <button id="selectNoneBtn" class="btn" type="button">すべて解除</button>
    <button id="backupBtn" class="btn" type="button">検出データをJSONで保存</button>
    <button id="applyBtn" class="btn danger" type="button" disabled>選択した項目のURLを削除</button>
    <span id="selCount" class="count"></span>
  </section>

  <section id="results"></section>
</main>

<script src="firebase-config.js"></script>
<script src="url-guard.js"></script>
<script src="auth.js?v=20260917-2"></script>
<script src="url-scan.js"></script>
</body>
</html>
