<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>導入支援一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=20260901-1"/>
  <link rel="stylesheet" href="auth.css"/>
  <link rel="stylesheet" href="cs.css?v=20260915-13"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header class="cs-app-header">
  <div class="header-inner">
    <div class="header-title">
      <img src="logo2.png" alt="Parasight" class="header-logo"/>
      <span class="cs-branch-tag">導入支援</span>
    </div>
    <nav class="header-main-nav" aria-label="メイン機能">
      <a href="index.html">案件管理</a>
      <a href="cs.html" class="active">導入支援</a>
      <a href="schedule.html#calendar">カレンダー</a>
      <a href="schedule.html#timeline">工程表</a>
    </nav>
    <div class="cs-header-actions">
      <a href="cs.html" class="btn-cs-list">戻る</a>
      <a href="cs.html" class="btn-add-cs">＋ 新規案件登録</a>
    </div>
  </div>
</header>
<div class="cs-stats-bar">
  <div class="cs-stats-inner">
    <div class="cs-stat-item cs-total"><span class="cs-stat-num" id="csTotalStat">0</span><span class="cs-stat-label">件（全体）</span></div>
  </div>
</div>

<div class="cs-search-bar">
  <div class="cs-search-inner">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="csSearchInput" class="search-input" placeholder="病院名で検索..."/>
    </div>
    <select id="csStaffFilter" class="filter-select"><option value="">全員表示</option></select>
    <select id="csStatusFilter" class="filter-select"><option value="">全CSステータス</option></select>
    <select id="csDateSort" class="filter-select" aria-label="最終対応日の並び順"><option value="desc">日付：新しい順</option><option value="asc">日付：古い順</option></select>
    <span class="count-label"><span id="csProjectCount">0 件</span>表示中</span>
  </div>
</div>

<main class="cs-list-content">
  <div class="cs-table-wrap">
    <table class="cs-status-table">
      <thead>
        <tr>
          <th>病院名</th>
          <th>支援担当</th>
          <th>CSステータス</th>
          <th>最終対応日</th>
          <th>メモ</th>
        </tr>
      </thead>
      <tbody id="csTableBody">
        <tr><td colspan="5" class="cs-list-loading">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div id="csDetailModal" class="modal-overlay">
  <div class="modal-box cs-detail-box">
    <div class="cs-modal-header">
      <h2 id="csDetailTitle">CS詳細</h2>
      <button class="btn-modal-close" onclick="closeCsDetailModal()" style="color:white;">✕</button>
    </div>
    <div class="modal-body" id="csDetailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeCsDetailModal()">閉じる</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="cs.js?v=20260915-13"></script>
</body>
</html>
