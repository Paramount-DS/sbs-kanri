<title>スケジュール生成ツール</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#eef2f6;font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;color:#172033}
.shell{height:100%;display:flex;flex-direction:column}
.switcher{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #d7dde5;box-shadow:0 2px 10px rgba(15,23,42,.08);z-index:10}
.switcher h1{font-size:17px;margin:0 14px 0 0;white-space:nowrap}.main-link{text-decoration:none;display:inline-flex;align-items:center}
.tab{border:1px solid #cbd3dd;background:#fff;color:#172033;border-radius:8px;padding:9px 16px;font-weight:800;cursor:pointer}
.tab:hover{background:#f4f7fa}.tab.active{background:#243247;color:#fff;border-color:#243247}
.view{display:none;flex:1;min-height:0}.view.active{display:block}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
@media(max-width:720px){.switcher{flex-wrap:wrap}.switcher h1{width:100%}.tab{flex:1;padding:8px}}
@media print{.switcher{display:none}.view{display:none!important}.view.active{display:block!important;height:100vh}}
</style>
</head>

function decodeUtf8Base64(value){const bytes=Uint8Array.from(atob(value),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
document.querySelector('#calendar iframe').srcdoc=decodeUtf8Base64(embeddedTools.calendar);
document.querySelector('#timeline iframe').srcdoc=decodeUtf8Base64(embeddedTools.timeline);
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===button));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===button.dataset.target));
  history.replaceState(null,'',`#${button.dataset.target}`);
}));
const requested=location.hash.slice(1);if(requested&&document.querySelector(`.tab[data-target="${requested}"]`))document.querySelector(`.tab[data-target="${requested}"]`).click();
</script>
